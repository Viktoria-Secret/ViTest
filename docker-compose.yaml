version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: viktor-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-viktor}
      POSTGRES_USER: ${POSTGRES_USER:-viktor}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-viktor_secret}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-viktor}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: viktor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: viktor-backend
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - MIKROTIK_HOST=${MIKROTIK_HOST:-router.local}
      - MIKROTIK_USER=${MIKROTIK_USER:-admin}
      - MIKROTIK_PASSWORD=${MIKROTIK_PASSWORD:-password}
      - CELERY_BROKER_URL=redis://redis:6379/0
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: sh -c "cd /app && uvicorn app.api:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build: ./frontend
    container_name: viktor-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    ports:
      - "3000:3000"
    command: npm run dev

volumes:
  postgres_data:
  redis_data: